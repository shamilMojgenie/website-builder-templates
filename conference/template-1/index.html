<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conference Template 1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arizonia&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section
      id="navbar-block"
      data-moj-web-fixed="false"
      data-moj-web-type="navbar"
      data-moj-web-label="Navbar"
      data-moj-web-category="structural"
    >
      <nav
        class="bg-white fixed w-full z-40 top-0 left-0 px-6 py-3 shadow-sm lg:flex lg:justify-between"
      >
        <input type="checkbox" id="navToggle" class="hidden peer" />

        <div class="flex justify-between items-center gap-3 lg:gap-6">
          <a href="/" class="flex items-center bg-white p-1 rounded-md">
            <img
              src="https://i.pinimg.com/736x/79/a2/f8/79a2f850afe2b2bf0611511731cf63e0.jpg"
              class="h-14 xl:h-[90px]"
            />
          </a>

          <label
            for="navToggle"
            class="lg:hidden inline-flex items-center justify-center w-10 h-10 bg-white rounded-lg cursor-pointer text-gray-600"
          >
            <img
              id="ip84l"
              data-gjs-type="image"
              src="https://cdn.iconscout.com/icon/premium/png-512-thumb/hamburger-menu-1836479-1558656.png?f=webp&amp;w=256"
              class=""
            />
          </label>
        </div>

        <div
          class="hidden peer-checked:block lg:flex lg:w-auto w-full pt-6 lg:pt-0 transition-all duration-300"
        >
          <div
            class="flex flex-col lg:flex-row w-full flex-wrap justify-end gap-6 lg:gap-4 xl:gap-6 items-start lg:items-center"
          >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Home</a
            >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >About</a
            >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Message</a
            >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Venue</a
            >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Sessions</a
            >

            <div class="relative hidden lg:block">
              <input type="checkbox" id="teamDrop" class="hidden peer" />
              <label
                for="teamDrop"
                class="cursor-pointer flex items-center text-base lg:text-[#6F6573] hover:text-[#C10817]"
              >
                Team
                <svg
                  class="w-2.5 h-2.5 ml-2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 10 6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m1 1 4 4 4-4"
                  />
                </svg>
              </label>

              <div
                class="absolute hidden peer-checked:block bg-white shadow-lg rounded-lg mt-2 w-40 py-2"
              >
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"
                  >Option One</a
                >
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"
                  >Option Two</a
                >
              </div>
            </div>

            <div class="lg:hidden w-full">
              <input type="checkbox" id="teamMobile" class="hidden peer" />

              <label
                for="teamMobile"
                class="flex items-center justify-between py-2 text-base font-medium text-[#C10817] cursor-pointer"
              >
                Team
                <svg
                  class="w-3 h-3 transition-transform peer-checked:rotate-180"
                  fill="none"
                  stroke="#C10817"
                  stroke-width="2"
                  viewBox="0 0 10 6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 5 5 1 1 5"
                  />
                </svg>
              </label>

              <div class="hidden peer-checked:block pl-4">
                <a href="#" class="block py-2 text-base text-[#C10817]"
                  >Option One</a
                >
                <a href="#" class="block py-2 text-base text-[#C10817]"
                  >Option Two</a
                >
              </div>
            </div>

            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Abstract</a
            >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Tariff</a
            >
            <a
              class="menu-item text-base lg:text-[#6F6573] hover:text-[#C10817]"
              href="#"
              >Contact Us</a
            >

            <a
              href="#"
              class="inline-block bg-[#C10817] border-2 border-[#C10817] text-white px-5 py-2 rounded-md hover:bg-white hover:text-[#C10817] transition-all duration-300 font-medium group"
            >
              Register Now-x
              <svg
                class="h-4 w-4 inline-block ml-2 transform group-hover:translate-x-1 duration-300"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                ></path>
              </svg>
            </a>
          </div>
        </div>
      </nav>
    </section>
  </body>
</html>
